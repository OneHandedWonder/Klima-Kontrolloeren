name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Setup Node.js for Selenium frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Klima-Kontrolloeren-Frontend/package-lock.json

      - name: Install frontend dependencies for Selenium tests
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm ci

      - name: Restore .NET dependencies
        run: dotnet restore Klima-Kontrolloeren-Backend.sln

      - name: Build solution
        run: dotnet build Klima-Kontrolloeren-Backend.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test Klima-Kontrolloeren-Backend.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "xUnit Test/TestResults"

      - name: Publish backend
        run: dotnet publish Klima-Kontrolloeren-Backend/Klima-Kontrolloeren-Backend.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FB88312E778F4D6AB5BE719886C08F7C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EF2DDFF1D8FE44DB8CA5708A578E610B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CA39480C7F294866BF82355384D226C3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'KlimaKontrolloeren-Backend'
          slot-name: 'Production'
          package: .
