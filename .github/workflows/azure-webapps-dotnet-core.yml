name: Deploy Vue Frontend to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Klima-Kontrolloeren-Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Klima-Kontrolloeren-Frontend
        run: npm ci

      - name: Build Vue app
        working-directory: Klima-Kontrolloeren-Frontend
        run: npm run build

      - name: Verify build output
        run: dir Klima-Kontrolloeren-Frontend\dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-app
          path: Klima-Kontrolloeren-Frontend/dist

  deploy:
    runs-on: windows-latest
    needs: build-and-deploy

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vue-app
          path: dist

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: KlimaKontrolloeren-Frontend
          package: dist
