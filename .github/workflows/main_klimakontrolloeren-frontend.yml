name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Klima-Kontrolloeren-Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm audit --audit-level=high

      - name: Clean previous build
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: rm -rf dist

      - name: Build Vue app
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue-app
          path: Klima-Kontrolloeren-Frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vue-app
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BF32AB1806914411A6279AA516F8C6D0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_09213DD0CB734A1299CCBA1DE10B28EC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6A1E1CD1B57B4A4097AAF06433541716 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: KlimaKontrolloeren-Frontend
          package: dist
