name: Test Backend CI/CD

on:
  push:
    branches:
      - Test
  pull_request:
    branches:
      - Test
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Setup Node.js for Selenium frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Klima-Kontrolloeren-Frontend/package-lock.json

      - name: Install frontend dependencies for Selenium tests
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm ci

      - name: Restore .NET dependencies
        run: dotnet restore Klima-Kontrolloeren-Backend.sln

      - name: Build solution
        run: dotnet build Klima-Kontrolloeren-Backend.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test Klima-Kontrolloeren-Backend.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Add test summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path "xUnit Test/TestResults" -Filter "*.trx" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $trx) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Backend test results"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "No TRX test result file was found."
            exit 0
          }

          [xml]$results = Get-Content $trx.FullName
          $counters = $results.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $skipped = [int]$counters.notExecuted

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Backend test results"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Total | Passed | Failed | Skipped |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| ---: | ---: | ---: | ---: |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| $total | $passed | $failed | $skipped |"

          if ($failed -gt 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Failed tests"
            $results.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq "Failed" } | ForEach-Object {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- `$($_.testName)`"
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-backend-test-results
          path: "xUnit Test/TestResults"

      - name: Publish backend
        run: dotnet publish Klima-Kontrolloeren-Backend/Klima-Kontrolloeren-Backend.csproj --configuration Release --no-build --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: test-dotnet-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/Test')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: test-dotnet-app

      - name: Verify backend deployment package
        run: |
          test -f Klima-Kontrolloeren-Backend.dll
          test ! -f index.html
          test ! -f server.js

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B88B7186813041C094D020181443A179 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4655ECFB0998440490EA947DA9141E86 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_32A79C6B8CB147599D8F485B8DA8559E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TestKlimaKontrolloerenBackend'
          slot-name: 'Production'
          package: .
