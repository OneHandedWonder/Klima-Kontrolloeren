name: Test Frontend CI/CD

on:
  push:
    branches:
      - Test
  pull_request:
    branches:
      - Test
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Klima-Kontrolloeren-Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm audit --audit-level=high

      - name: Clean previous build
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: rm -rf dist

      - name: Build Vue app
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm run build

      - name: Prepare Azure App Service package
        run: |
          rm -rf frontend-deploy
          mkdir frontend-deploy
          cp -R Klima-Kontrolloeren-Frontend/dist/. frontend-deploy/
          cat > frontend-deploy/package.json <<'JSON'
          {
            "name": "test-klimakontrolloerenfrontend",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node server.js"
            },
            "engines": {
              "node": "20.x"
            }
          }
          JSON
          cat > frontend-deploy/server.js <<'JS'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          const root = __dirname;
          const port = process.env.PORT || 8080;
          const types = {
            '.css': 'text/css',
            '.html': 'text/html',
            '.ico': 'image/x-icon',
            '.js': 'text/javascript',
            '.json': 'application/json',
            '.png': 'image/png',
            '.svg': 'image/svg+xml',
            '.txt': 'text/plain',
            '.woff': 'font/woff',
            '.woff2': 'font/woff2'
          };

          http.createServer((request, response) => {
            const requestPath = decodeURIComponent(new URL(request.url, `http://${request.headers.host}`).pathname);
            const safePath = path.normalize(requestPath).replace(/^(\.\.[/\\])+/, '');
            let filePath = path.join(root, safePath);

            if (requestPath.endsWith('/')) {
              filePath = path.join(filePath, 'index.html');
            }

            fs.stat(filePath, (statError, stat) => {
              if (statError || !stat.isFile()) {
                filePath = path.join(root, 'index.html');
              }

              const stream = fs.createReadStream(filePath);
              stream.on('error', () => {
                response.writeHead(500);
                response.end('Unable to serve file.');
              });
              response.writeHead(200, {
                'Content-Type': types[path.extname(filePath)] || 'application/octet-stream'
              });
              stream.pipe(response);
            });
          }).listen(port);
          JS

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: test-vue-app
          path: frontend-deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/Test')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: test-vue-app
          path: frontend-deploy

      - name: Verify frontend deployment package
        run: |
          test -f frontend-deploy/index.html
          test -f frontend-deploy/server.js
          test -f frontend-deploy/package.json
          test -d frontend-deploy/assets
          test ! -f frontend-deploy/Klima-Kontrolloeren-Backend.dll

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3F3BB658C5D7484B844226B8CCF4FBA6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_87EB796B24744D8AA1FAE20758104D32 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4E51181873574BA1B44B095CDEF7C142 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TestKlimaKontrolloerenFrontend'
          slot-name: 'Production'
          package: frontend-deploy
