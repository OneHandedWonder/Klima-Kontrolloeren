name: Test Frontend CI/CD

on:
  push:
    branches:
      - Test
  pull_request:
    branches:
      - Test
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Klima-Kontrolloeren-Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm audit --audit-level=high

      - name: Clean previous build
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: rm -rf dist

      - name: Build Vue app
        working-directory: ./Klima-Kontrolloeren-Frontend
        run: npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: test-vue-app
          path: Klima-Kontrolloeren-Frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/Test')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: test-vue-app
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3F3BB658C5D7484B844226B8CCF4FBA6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_87EB796B24744D8AA1FAE20758104D32 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4E51181873574BA1B44B095CDEF7C142 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TestKlimaKontrolloerenFrontend'
          slot-name: 'Production'
          package: dist
